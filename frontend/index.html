<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cu / BC 实时行情仪表盘</title>
  <style>
    :root {
      --bg:       #0d1117;
      --card-bg:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --green:    #3fb950;
      --red:      #f85149;
      --yellow:   #d29922;
      --blue:     #58a6ff;
      --purple:   #bc8cff;
      --accent:   #1f6feb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── 顶部标题栏 ── */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    header h1 span { color: var(--blue); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    #update-time { font-variant-numeric: tabular-nums; }

    /* ── 主体布局 ── */
    main {
      flex: 1;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── 卡片通用样式 ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 2px;
    }

    /* ── 合约行 ── */
    .contract-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .contract-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
    }

    .contract-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .contract-symbol {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }

    .contract-price {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      transition: color 0.3s;
    }

    .up   { color: var(--red);   }
    .down { color: var(--green); }
    .flat { color: var(--text);  }

    /* ── 价差 / 比值卡片 ── */
    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .spread-value { color: var(--yellow); }
    .ratio-value  { color: var(--purple); }

    /* ── 持仓 / 成交量表格 ── */
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .detail-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
    }

    .detail-table td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(48,54,61,0.5);
    }

    .detail-table tr:last-child td { border-bottom: none; }

    /* ── 全宽卡片 ── */
    .full { grid-column: 1 / -1; }

    /* ── 状态栏 ── */
    .status-bar {
      padding: 8px 24px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .status-bar span { font-variant-numeric: tabular-nums; }

    /* ── 闪烁动画（价格变动时） ── */
    @keyframes flash-up {
      0%   { background-color: rgba(248, 81, 73, 0.25); }
      100% { background-color: transparent; }
    }

    @keyframes flash-down {
      0%   { background-color: rgba(63, 185, 80, 0.25); }
      100% { background-color: transparent; }
    }

    .flash-up   { animation: flash-up   0.7s ease-out forwards; }
    .flash-down { animation: flash-down 0.7s ease-out forwards; }

    /* ── 响应式 ── */
    @media (max-width: 680px) {
      main { grid-template-columns: 1fr; }
      .contract-row, .metric-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>📊 <span>Cu / BC</span> 实时行情仪表盘</h1>
  <div class="header-right">
    <span><span class="live-dot"></span> LIVE</span>
    <span>更新: <span id="update-time">--:--:--</span></span>
  </div>
</header>

<main>

  <!-- 沪铜卡片 -->
  <div class="card">
    <div class="card-title">沪铜 SHFE.CU</div>
    <div class="contract-row">
      <div class="contract-box">
        <div class="contract-label">近月 M+1</div>
        <div class="contract-symbol" id="cu-m1-sym">—</div>
        <div class="contract-price flat" id="cu-m1-price">—</div>
      </div>
      <div class="contract-box">
        <div class="contract-label">远月 M+2</div>
        <div class="contract-symbol" id="cu-m2-sym">—</div>
        <div class="contract-price flat" id="cu-m2-price">—</div>
      </div>
    </div>
    <div class="metric-box">
      <div class="metric-label">跨月价差 CU Spread</div>
      <div class="metric-value spread-value" id="cu-spread">—</div>
    </div>
    <table class="detail-table" id="cu-table">
      <thead>
        <tr>
          <th>合约</th>
          <th>买价</th>
          <th>卖价</th>
          <th>持仓(手)</th>
          <th>成交量</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 国际铜卡片 -->
  <div class="card">
    <div class="card-title">国际铜 INE.BC</div>
    <div class="contract-row">
      <div class="contract-box">
        <div class="contract-label">近月 M+1</div>
        <div class="contract-symbol" id="bc-m1-sym">—</div>
        <div class="contract-price flat" id="bc-m1-price">—</div>
      </div>
      <div class="contract-box">
        <div class="contract-label">远月 M+2</div>
        <div class="contract-symbol" id="bc-m2-sym">—</div>
        <div class="contract-price flat" id="bc-m2-price">—</div>
      </div>
    </div>
    <div class="metric-box">
      <div class="metric-label">跨月价差 BC Spread</div>
      <div class="metric-value spread-value" id="bc-spread">—</div>
    </div>
    <table class="detail-table" id="bc-table">
      <thead>
        <tr>
          <th>合约</th>
          <th>买价</th>
          <th>卖价</th>
          <th>持仓(手)</th>
          <th>成交量</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 跨品种套利卡片 -->
  <div class="card full">
    <div class="card-title">跨品种套利 CU / BC 比值</div>
    <div class="metric-row">
      <div class="metric-box">
        <div class="metric-label">M+1 比值</div>
        <div class="metric-value ratio-value" id="arb-m1">—</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">M+2 比值</div>
        <div class="metric-value ratio-value" id="arb-m2">—</div>
      </div>
    </div>
  </div>

</main>

<div class="status-bar">
  <span>数据源: TqSdk 实时行情</span>
  <span>缓存合约数: <span id="cache-count">0</span></span>
  <span>API: <span id="api-status">—</span></span>
</div>

<script>
  // ── 全局状态 ──────────────────────────────────────────────────────────────
  const PREV = {};          // 记录上一次价格，用于闪烁方向判断
  let lastFetch = 0;        // 上次 fetch 时间戳
  let fetchCount = 0;       // 累计请求计数

  const API_BASE = window.location.origin;

  // ── 工具函数 ──────────────────────────────────────────────────────────────
  function fmt(v, decimals = 1) {
    if (v == null || isNaN(v)) return "—";
    return v.toFixed(decimals);
  }

  function fmtOI(v) {
    if (v == null || isNaN(v)) return "—";
    return Number(v).toLocaleString();
  }

  function flashEl(id, newVal) {
    if (PREV[id] === undefined) return;
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("flash-up", "flash-down");
    void el.offsetWidth; // 强制重绘
    if (newVal > PREV[id]) el.classList.add("flash-up");
    else if (newVal < PREV[id]) el.classList.add("flash-down");
  }

  function setPrice(id, val, decimals = 1) {
    const el = document.getElementById(id);
    if (!el) return;
    const formatted = fmt(val, decimals);
    el.textContent = formatted;
    el.className = "contract-price flat";
    flashEl(id, val);
    if (val != null && !isNaN(val)) {
      if (PREV[id] !== undefined && val > PREV[id]) el.className = "contract-price up";
      else if (PREV[id] !== undefined && val < PREV[id]) el.className = "contract-price down";
    }
    PREV[id] = val;
  }

  function setMetric(id, val, decimals = 2) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = fmt(val, decimals);
  }

  function renderQuoteRows(tableId, quotes) {
    const tbody = document.querySelector(`#${tableId} tbody`);
    tbody.innerHTML = (quotes || [])
      .filter(Boolean)
      .map(q => `
        <tr>
          <td>${q.symbol || "—"}</td>
          <td>${fmt(q.bid_price1)}</td>
          <td>${fmt(q.ask_price1)}</td>
          <td>${fmtOI(q.open_interest)}</td>
          <td>${fmtOI(q.volume)}</td>
        </tr>
      `)
      .join("");
  }

  // ── 渲染仪表盘 ─────────────────────────────────────────────────────────────
  function render(data) {
    if (!data) return;

    // 更新头部时间
    const updateTime = data.update_time || "";
    document.getElementById("update-time").textContent =
      updateTime.split(/[T ]/).pop() || "—";

    // ── 沪铜 ──
    const cu = data.cu;
    if (cu) {
      document.getElementById("cu-m1-sym").textContent = cu.m_plus_1 || "—";
      document.getElementById("cu-m2-sym").textContent = cu.m_plus_2 || "—";
      setPrice("cu-m1-price", cu.price_m1);
      setPrice("cu-m2-price", cu.price_m2);
      setMetric("cu-spread", cu.spread);
      renderQuoteRows("cu-table", [cu.quote_m1, cu.quote_m2]);
    }

    // ── 国际铜 ──
    const bc = data.bc;
    if (bc) {
      document.getElementById("bc-m1-sym").textContent = bc.m_plus_1 || "—";
      document.getElementById("bc-m2-sym").textContent = bc.m_plus_2 || "—";
      setPrice("bc-m1-price", bc.price_m1);
      setPrice("bc-m2-price", bc.price_m2);
      setMetric("bc-spread", bc.spread);
      renderQuoteRows("bc-table", [bc.quote_m1, bc.quote_m2]);
    }

    // ── 套利比值 ──
    const arb = data.arb;
    if (arb) {
      setMetric("arb-m1", arb.m_plus_1_ratio, 4);
      setMetric("arb-m2", arb.m_plus_2_ratio, 4);
    }
  }

  // ── 轮询数据 ───────────────────────────────────────────────────────────────
  async function poll() {
    fetchCount++;
    const statusEl = document.getElementById("api-status");
    statusEl.textContent = "请求中…";

    try {
      const resp = await fetch(`${API_BASE}/api/dashboard`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      lastFetch = Date.now();
      render(data);
      statusEl.textContent = `${data.status || "未知"} #${fetchCount}`;
      document.getElementById("cache-count").textContent = data.cache_size || "?";
    } catch (err) {
      statusEl.textContent = "离线 / " + err.message;
    }

    // 3 秒后继续
    setTimeout(poll, 3000);
  }

  // ── 启动 ──────────────────────────────────────────────────────────────────
  poll();
</script>

</body>
</html>
