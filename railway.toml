[railway]
  build = "backend"

  [railway.variables]
    PYTHON_VERSION = "3.11"

[build]
  buildCommand = "cd backend && python3 -m pip install -r requirements.txt --verbose"

[deploy]
  startCommand = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
  watchPatterns = ["backend/**/*.py"]